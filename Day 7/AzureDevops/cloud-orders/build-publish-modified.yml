build-and-publish:
  name: Build and publish image
  needs: test
  runs-on: ubuntu-latest

  permissions:
    contents: read
    packages: write

  steps:
    # Required: downloads Dockerfile, app.js and package.json
    # into this job's GitHub runner.
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Sign in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/cloud-orders:main
          ghcr.io/${{ github.repository_owner }}/cloud-orders:latest
          ghcr.io/${{ github.repository_owner }}/cloud-orders:sha-${{ github.sha }}