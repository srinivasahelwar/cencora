name: Day 8 CI CD to Azure App Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy_to_qa:
        description: "Deploy to QA after build?"
        required: true
        default: "false"
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: srinivasahelwar/cencora-order-api-snn
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test application import
        run: |
          python -m py_compile app/main.py

  docker_build_push:
    name: Build and push image to GHCR
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tag
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -f ./app/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ./app

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy_dev:
    name: Deploy to DEV
    needs: docker_build_push
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy container to Azure Web App - DEV
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME_DEV }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker_build_push.outputs.image_tag }}

  deploy_qa:
    name: Deploy to QA
    needs: [docker_build_push, deploy_dev]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_qa == 'true'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Deploy same image to Azure Web App - QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME_QA }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker_build_push.outputs.image_tag }}
